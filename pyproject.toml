[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ft-vs-prompt"
version = "0.1.0"
description = "Fine-Tuning vs Prompting Study — when does fine-tuning beat a good prompt?"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["fine-tuning", "prompt-engineering", "lora", "llm", "cost-analysis", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "datasets>=2.18",
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "trl>=0.8",
    "accelerate>=0.28",
    "bitsandbytes>=0.42",
    "sentencepiece>=0.2",
    "scikit-learn>=1.4",
    "plotly>=5.18",
    "rich>=13.7",
    "structlog>=24.1",
    "wandb>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.8",
]

[project.scripts]
ft-vs-prompt = "ft_vs_prompt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ft_vs_prompt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
